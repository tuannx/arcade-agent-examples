name: Refresh reports

on:
  schedule:
    - cron: "17 3 1 * *"  # monthly, 1st at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned arcade-agent
        run: make install

      - name: Run all scenarios
        run: make all

      - name: Commit refreshed reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "chore: monthly report refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
