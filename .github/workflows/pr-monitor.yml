name: pr-monitor
# Autoharness: scan famous upstream PRs, publish to our Pages only.
# No upstream comments. Mention happens in our own issue/report.
# Fix v2: list API has no additions/comments -> must call detail per PR.

on:
  schedule:
    - cron: "46 13 * * *" # ~08:46 Chicago
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan large / debated PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/monitor
          echo "# PR monitor — $(date -u +%F)" > docs/monitor/latest.md
          : > docs/monitor/mentions.txt
          total=0
          for repo in django/django facebook/react vuejs/core; do
            echo "" >> docs/monitor/latest.md
            echo "## $repo" >> docs/monitor/latest.md
            count=0
            # list only returns number/title/url; detail returns additions/deletions/comments
            for num in $(gh api "repos/$repo/pulls?state=open&per_page=30&sort=updated" -q '.[].number'); do
              line=$(gh api "repos/$repo/pulls/$num" -q '"- \(.html_url) · +\(.additions)/-\(.deletions) · files \(.changed_files) · comments \(.comments + .review_comments) · \(.title) ||| \((.additions + .deletions)) \(.changed_files) \((.comments + .review_comments))"')
              meta=$(echo "$line" | awk -F' \\|\\|\\| ' '{print $2}')
              total_lines=$(echo $meta | awk '{print $1}')
              files=$(echo $meta | awk '{print $2}')
              comments=$(echo $meta | awk '{print $3}')
              text=$(echo "$line" | awk -F' \\|\\|\\| ' '{print $1}')
              if [ "${total_lines:-0}" -gt 500 ] || [ "${files:-0}" -gt 20 ] || [ "${comments:-0}" -gt 15 ]; then
                echo "$text" >> docs/monitor/latest.md
                echo "${repo}#${num}" >> docs/monitor/mentions.txt
                count=$((count+1))
              fi
            done
            if [ "$count" -eq 0 ]; then echo "- no PR over threshold in top 30 updated" >> docs/monitor/latest.md; fi
            echo "scanned $repo: $count matched"
            total=$((total+count))
          done
          echo "" >> docs/monitor/latest.md
          echo "Total matched: $total" >> docs/monitor/latest.md
          cat docs/monitor/latest.md
      - name: Commit monitor snapshot
        run: |
          git config user.name "autoharness"
          git config user.email "autoharness@users.noreply.github.com"
          git add docs/monitor/
          git diff --cached --quiet || git commit -m "monitor: daily PR scan (detail API)"
          git push || true
